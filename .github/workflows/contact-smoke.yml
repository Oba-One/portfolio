name: Contact Form Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contact-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-contact-form:
    name: Submit live contact form
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit contact form
        env:
          CONTACT_URL: https://afolabi.info/api/contact/
        run: |
          set -euo pipefail

          payload='{"email":"codex-contact-qa@example.com","message":"QA test from Codex validating the production contact form on 2026-06-21. Please ignore."}'
          response_file="$(mktemp)"

          status_code="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 \
            --request POST "$CONTACT_URL" \
            --header 'content-type: application/json' \
            --data "$payload" \
            --write-out '%{http_code}' \
            --output "$response_file")"

          echo "HTTP status: $status_code"
          cat "$response_file"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            exit 1
          fi
